# System factory settings. See https://github.com/hoangtrankim/system-factory
repo: hoangtrankim/todo-app
base: main
maxRounds: 3
# How the factory merges a reviewed, green PR: merge, squash or rebase.
mergeMethod: merge
# Who posts the factory/review status: reviewer (its pass) or gate (the forge-gate workflow, right
# before it merges). gate, because a Claude session in the cloud cannot post statuses.
reviewStatus: gate
# High-risk PRs (see risk.yml) wait this many hours before the gate merges them. Only the
# owner adding `approve` to the PR by hand merges one early; `hold` from anyone stops it.
owner: hoangtrankim
holdHours: 24
# Component name -> paths it owns. Tickets are tagged with these names; the reviewer
# checks that a PR stays inside its components (tests/ is always allowed).
components:
  api: ["server.js", "lib/**"]
  ui: ["public/**"]
