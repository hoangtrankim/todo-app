<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todos</title>
    <style>
      .todo-text.done {
        text-decoration: line-through;
      }
      [aria-pressed='true'] {
        font-weight: bold;
        border: 2px solid currentColor;
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Todos</h1>
      <form id="new-todo-form" novalidate>
        <label for="new-todo">New todo</label>
        <input id="new-todo" name="text" type="text" autocomplete="off" />
        <button type="submit">Add</button>
      </form>
      <p id="todo-error" role="alert" hidden></p>
      <p id="todo-count" hidden></p>
      <button type="button" id="clear-completed" hidden>Clear completed</button>
      <div role="group" aria-label="Filter">
        <button type="button" data-filter="all">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="done">Done</button>
      </div>
      <p id="empty-message" hidden>No todos yet</p>
      <ul id="todo-list" aria-label="Todos" hidden></ul>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
